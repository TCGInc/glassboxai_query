# Glass Box FDA on AWS: one EC2 instance running the project's Docker Compose stack.
# Deployed and updated by deploy/aws.sh (see docs/aws-deployment.md); not meant to be run by hand.
#
# Public: ports 80 and 443 only (Caddy on the instance: LibreChat, and JupyterLab behind its token
# and an IP allow-list). No SSH: administration goes through SSM Session Manager.
AWSTemplateFormatVersion: "2010-09-09"
Description: Glass Box FDA demo (LibreChat + JupyterLab) on a single EC2 instance

Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Ubuntu 24.04 amd64 AMI. deploy/aws.sh resolves it on first create only; changing it
      replaces the instance and loses its data (chats, users).
  InstanceType:
    Type: String
    Default: t3.large
    Description: x86_64 only (the LibreChat image is amd64). Changing it stops and restarts the instance.
  VolumeSize:
    Type: Number
    Default: 40
    MinValue: 30
    Description: Root volume in GiB. Set at creation; changing it later replaces the instance.
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$'
    Description: >-
      Who may reach the sites (port 443). Port 80 stays open to everyone: Let's Encrypt must
      reach it to issue certificates, and it only redirects to HTTPS.
  DomainName:
    Type: String
    Default: ""
    Description: Optional real domain. Empty means <ip-with-dashes>.sslip.io (no DNS resources).
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional public Route 53 zone for DomainName; creates the two A records.

Conditions:
  CreateDnsRecords: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  # --- Network: a small VPC of our own, so the stack doesn't depend on a default VPC ---
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.80.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.80.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      # The instance needs the internet (SSM, packages) before the Elastic IP is attached
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from AllowedCidr; HTTP for Lets Encrypt and redirects; no SSH
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedCidr }
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  # --- Release tarballs (git archive of the deployed commit) ---
  ReleaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - { Id: expire-old-releases, Status: Enabled, Prefix: releases/, ExpirationInDays: 90 }

  # --- Instance identity: SSM management, read its releases and its own parameters only ---
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: glassbox-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${ReleaseBucket.Arn}/releases/*
              - Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameters]
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/glassbox/${AWS::StackName}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/glassbox/${AWS::StackName}/*
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      # IMDSv2 only; a hop limit of 1 keeps the containers away from the instance's credentials
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            Encrypted: true
            DeleteOnTermination: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]
      # No user data: deploy/aws.sh installs and deploys everything through SSM Run Command

  # A fixed public IP, so the sslip.io names (and any DNS records) survive stop/start
  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  LibreChatRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ElasticIp]

  JupyterRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub jupyter.${DomainName}
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ElasticIp]

Outputs:
  InstanceId:
    Value: !Ref Instance
  BucketName:
    Value: !Ref ReleaseBucket
  PublicIp:
    Value: !Ref ElasticIp
