# Glass Box AI: Database Query Agent (FDA Demo)
# Four services: postgres (FDA data), jupyter (AWS Strands), librechat (chat UI) and mongodb
# (LibreChat's own database)
# Usage:  cp .env.example .env  &&  ./start.sh
# Reset:  ./stop.sh --reset   (deletes the volumes; the FDA data reloads and LibreChat starts fresh)

name: glassbox-db-agent

services:

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fda}
      POSTGRES_USER: ${POSTGRES_USER:-fda_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Consumed by db/init/00-roles.sh to create the read-only agent role
      AGENT_RO_USER: ${AGENT_RO_USER:-agent_ro}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:?set AGENT_RO_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs in filename order, only when the data volume is empty:
      #   00-roles.sh    -> create agent_ro (SELECT only, read-only txns, statement_timeout)
      #   10-schema.sql  -> tables, keys, indexes
      #   20-load.sql    -> COPY from /data/*.csv
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h forces TCP: during first-start init only a socket-only temporary server
      # is up, and a socket check would report healthy before the data load ends.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  jupyter:
    build:                    # python:3.12-slim + jupyterlab + strands-agents + pytest + psycopg
      context: ./jupyter
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Agent connects ONLY as the read-only role
      FDA_DATABASE_URL: postgresql://${AGENT_RO_USER:-agent_ro}:${AGENT_RO_PASSWORD}@postgres:5432/${POSTGRES_DB:-fda}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-gpt-6-luna}
      # Unset = none (visible reasoning); set empty to use the provider default
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EVAL_RUNS: ${EVAL_RUNS:-5}
      EVAL_MIN_CORRECT: ${EVAL_MIN_CORRECT:-0.8}
      EVAL_QUESTIONS: ${EVAL_QUESTIONS:-}
      EVAL_TIERS: ${EVAL_TIERS:-}
      EVAL_RUNTIME: ${EVAL_RUNTIME:-strands}
      # The LibreChat parity runner logs in as the demo admin
      LIBRECHAT_URL: http://librechat:3080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tcg.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-glassbox}
    volumes:
      - ./agent:/workspace/agent          # system prompt, skills, tools (single source of truth)
      - ./tests:/workspace/tests
      - ./notebooks:/workspace/notebooks
      - ./librechat:/workspace/librechat  # agent/librechat_config.py writes librechat.yaml here
    working_dir: /workspace
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --IdentityProvider.token=${JUPYTER_TOKEN:?set JUPYTER_TOKEN in .env}
    ports:
      - "127.0.0.1:8888:8888"

  mongodb:
    # LibreChat's own database (users, chats). Internal only: no host port.
    image: mongo:8.0.20
    restart: unless-stopped
    command: mongod --noauth --quiet
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  librechat:
    # The official image, unmodified. The agent is configuration: librechat/librechat.yaml,
    # written from agent/ by agent/librechat_config.py (start.sh runs it).
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      DOMAIN_CLIENT: http://localhost:3080
      DOMAIN_SERVER: http://localhost:3080
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      APP_TITLE: Glass Box FDA
      NO_INDEX: "true"
      # Only the demo admin, created by start.sh; no sign-up page, no password reset.
      ALLOW_REGISTRATION: "false"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_SOCIAL_LOGIN: "false"
      ALLOW_PASSWORD_RESET: "false"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "true"
      # Generated into .env by start.sh on first run
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:?run ./start.sh to generate the LibreChat secrets}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:?run ./start.sh to generate the LibreChat secrets}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:?run ./start.sh to generate the LibreChat secrets}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:?run ./start.sh to generate the LibreChat secrets}
      # No conversation search service (Meilisearch) and no Redis: fewer containers.
      # One LibreChat process, so its scheduler needs no shared store.
      SEARCH: "false"
      SCHEDULES_SINGLE_PROCESS: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Demo: the plain models offered next to Glass Box FDA, so "what can the model do by
      # itself?" can be answered without a 100-model picker. LLM_MODEL_ID must be in this list.
      OPENAI_MODELS: gpt-6-luna,gpt-6-sol,gpt-6.1-sol,gpt-5.6-luna,gpt-5.6-sol,gpt-5.6-terra
      # Read by the tool server (agent/mcp_server.py), which LibreChat starts; same read-only
      # role as Strands. Only this URL reaches the container, never the admin credentials.
      FDA_DATABASE_URL: postgresql://${AGENT_RO_USER:-agent_ro}:${AGENT_RO_PASSWORD}@postgres:5432/${POSTGRES_DB:-fda}
      # uv installs the tool server's two dependencies here once, not on every restart
      UV_CACHE_DIR: /app/data/uv-cache
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      # The tool server imports agent/tools.py, so both runtimes share one implementation
      - ./agent:/opt/glassbox/agent:ro
      # The two skills, loaded as LibreChat's read-only deployment skills
      - ./agent/skills:/app/skill:ro
      - librechat-data:/app/data
    ports:
      - "127.0.0.1:3080:3080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3080/health"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
  mongodata:
  librechat-data:
